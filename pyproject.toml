[project]
name = "spark-oedo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "FumiHubCNS", email = "fendo@cns.s.u-tokyo.ac.jp" }
]
requires-python = ">=3.13"
dependencies = [
  "pyspark==4.0.1",
  "pandas",
  "pyarrow",
  "numpy",
  "matplotlib",
  "plotly",
  "scipy",
  "marimo>=0.19.9",
  "ipython>=9.10.0",
  "ipywidgets>=8.1.8",
  "kafka>=1.3.5",
  "kafka-python>=2.3.0",
  "torch>=2.10.0",
]

[tool.uv.sources]
marimo-lib = { git = "https://github.com/FumiHubCNS/marimo-lib" }

[build-system]
requires = ["uv_build>=0.9.9,<0.10.0"]
build-backend = "uv_build"


